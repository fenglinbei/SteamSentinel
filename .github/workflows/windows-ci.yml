name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-selftest:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read and validate the build contract
        id: contract
        shell: pwsh
        run: |
          $sdk = [string]((Get-Content -LiteralPath 'global.json' -Raw | ConvertFrom-Json).sdk.version)
          [xml]$props = Get-Content -LiteralPath 'Directory.Build.props' -Raw
          $version = [string]$props.Project.PropertyGroup.VersionPrefix
          $targetFramework = [string]$props.Project.PropertyGroup.TargetFramework
          $minimumTests = [int]$props.Project.PropertyGroup.SteamSentinelMinimumSelfTests
          if ($sdk -notmatch '^\d+\.\d+\.\d+$' -or $version -notmatch '^\d+\.\d+\.\d+$' -or
              [string]::IsNullOrWhiteSpace($targetFramework) -or $minimumTests -lt 1) {
            throw 'The central build contract is invalid.'
          }

          [xml]$appManifest = Get-Content -LiteralPath 'SteamSentinel.App/app.manifest' -Raw
          [xml]$brokerManifest = Get-Content -LiteralPath 'SteamSentinel.Broker/app.manifest' -Raw
          $expectedManifestVersion = "$version.0"
          if ($appManifest.assembly.assemblyIdentity.version -ne $expectedManifestVersion -or
              $brokerManifest.assembly.assemblyIdentity.version -ne $expectedManifestVersion) {
            throw 'Application manifest version drifted from Directory.Build.props.'
          }
          $installer = Get-Content -LiteralPath 'installer/SteamSentinel.iss' -Raw
          if ($installer -notmatch ('(?m)^#define AppVersion "' + [regex]::Escape($version) + '"\r?$')) {
            throw 'Installer default version drifted from Directory.Build.props.'
          }

          "sdk=$sdk" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "target_framework=$targetFramework" >> $env:GITHUB_OUTPUT
          "minimum_tests=$minimumTests" >> $env:GITHUB_OUTPUT

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ steps.contract.outputs.sdk }}
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Verify SDK pin
        shell: pwsh
        run: |
          $actual = (dotnet --version).Trim()
          $expected = '${{ steps.contract.outputs.sdk }}'
          if ($actual -ne $expected) {
            throw "Expected .NET SDK $expected, got $actual."
          }

      - name: Cache WinRAR 7.23 fixture tool installer
        id: winrar-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}\winrar-cache
          key: winrar-x64-723-8FF0DAF3ED564CC743C0E23FF2E253997FFC74460F9673F0B6DD037B2DB4CE7B

      - name: Install and verify archive fixture tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Test-only dependency; never copied into SteamSentinel release artifacts.
          # Fixed official installer: https://www.rarlab.com/download.htm
          $cacheDir = Join-Path $env:RUNNER_TEMP 'winrar-cache'
          New-Item -ItemType Directory -Path $cacheDir -Force | Out-Null
          $installer = Join-Path $cacheDir 'winrar-x64-723.exe'
          $cacheHit = '${{ steps.winrar-cache.outputs.cache-hit }}' -eq 'true'
          if ($cacheHit -and (Test-Path -LiteralPath $installer -PathType Leaf)) {
            Write-Host "Using cached WinRAR 7.23 installer for verification: $installer"
          }
          else {
            if (Test-Path -LiteralPath $installer) {
              throw 'Refusing to overwrite an existing archive-tool installer.'
            }
            Invoke-WebRequest -Uri 'https://www.rarlab.com/rar/winrar-x64-723.exe' `
              -OutFile $installer -TimeoutSec 120
          }
          $expectedHash = '8FF0DAF3ED564CC743C0E23FF2E253997FFC74460F9673F0B6DD037B2DB4CE7B'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'WinRAR 7.23 installer SHA-256 mismatch.'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate -or
              $signature.SignerCertificate.GetNameInfo('SimpleName', $false) -ne 'win.rar GmbH' -or
              $null -eq $signature.TimeStamperCertificate) {
            throw 'WinRAR installer publisher signature or timestamp validation failed.'
          }
          if ((Get-Item -LiteralPath $installer).VersionInfo.ProductVersion -ne '7.23.0') {
            throw 'WinRAR installer version does not match the pinned dependency.'
          }
          $install = Start-Process -FilePath $installer -ArgumentList '-s1', '-d"C:\Program Files\WinRAR"' `
            -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "WinRAR fixture-tool installation failed ($($install.ExitCode))."
          }
          foreach ($tool in @('C:\Program Files\7-Zip\7z.exe', 'C:\Program Files\WinRAR\Rar.exe')) {
            if (-not (Test-Path -LiteralPath $tool -PathType Leaf)) {
              throw "Required archive fixture tool is missing: $tool"
            }
            Write-Host "$tool : $((Get-Item -LiteralPath $tool).VersionInfo.ProductVersion)"
          }

      - name: Restore locked dependencies
        shell: pwsh
        run: |
          dotnet restore SteamSentinel.slnx --locked-mode `
            --source https://api.nuget.org/v3/index.json `
            -p:NuGetAudit=true -p:NuGetAuditMode=all
          if ($LASTEXITCODE -ne 0) { throw "Locked restore failed ($LASTEXITCODE)." }
          git diff --exit-code -- '**/packages.lock.json'
          if ($LASTEXITCODE -ne 0) { throw 'Restore changed a lock file.' }

      - name: Build
        shell: pwsh
        run: |
          $buildId = "$env:GITHUB_SHA.ci"
          dotnet build SteamSentinel.slnx -c Release --no-restore `
            "-p:SteamSentinelSourceRevision=$env:GITHUB_SHA" `
            '-p:SteamSentinelBuildChannel=ci' `
            "-p:SteamSentinelBuildId=$buildId"
          if ($LASTEXITCODE -ne 0) { throw "Build failed ($LASTEXITCODE)." }

          $targetFramework = '${{ steps.contract.outputs.target_framework }}'
          $assemblyPath = Join-Path 'SteamSentinel.App/bin/Release' "$targetFramework/SteamSentinel.dll"
          $productVersion = (Get-Item -LiteralPath $assemblyPath).VersionInfo.ProductVersion
          $version = '${{ steps.contract.outputs.version }}'
          if ($productVersion -ne "$version+$buildId") {
            throw "Unexpected ProductVersion: $productVersion"
          }

      - name: Verify whitespace formatting
        shell: pwsh
        run: |
          dotnet format whitespace SteamSentinel.slnx --verify-no-changes --no-restore
          if ($LASTEXITCODE -ne 0) { throw "Whitespace verification failed ($LASTEXITCODE)." }

      - name: Run complete self-test and enforce the baseline
        id: selftest
        shell: pwsh
        run: |
          $resultPath = Join-Path $env:RUNNER_TEMP 'SteamSentinel-selftest-results.json'
          "result_path=$resultPath" >> $env:GITHUB_OUTPUT
          dotnet run --project SteamSentinel.SelfTest/SteamSentinel.SelfTest.csproj `
            -c Release --no-build -- --results $resultPath --timings
          if ($LASTEXITCODE -ne 0) { throw "SelfTest failed ($LASTEXITCODE)." }
          if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) {
            throw 'SelfTest did not write its machine-readable result.'
          }

          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if ($null -eq $result.PSObject.Properties['elapsedMs'] -or [long]$result.elapsedMs -lt 0) {
            throw 'SelfTest result is missing a valid elapsedMs value.'
          }
          $minimumTests = [int]'${{ steps.contract.outputs.minimum_tests }}'
          if ([int]$result.failed -ne 0 -or [int]$result.passed -lt $minimumTests -or [int]$result.skipped -ne 0) {
            throw "SelfTest baseline failed: passed=$($result.passed), failed=$($result.failed), skipped=$($result.skipped)."
          }
          $version = '${{ steps.contract.outputs.version }}'
          if ($result.version -ne $version -or $result.buildIdentity -ne "$version+$env:GITHUB_SHA.ci") {
            throw "SelfTest provenance mismatch: version=$($result.version), buildIdentity=$($result.buildIdentity)."
          }

      - name: Upload machine-readable self-test result
        if: always() && steps.selftest.outputs.result_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SteamSentinel-selftest-${{ github.sha }}
          path: ${{ steps.selftest.outputs.result_path }}
          if-no-files-found: error
          retention-days: 30

  unified-startup:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read and validate the build contract
        id: contract
        shell: pwsh
        run: |
          $sdk = [string]((Get-Content -LiteralPath 'global.json' -Raw | ConvertFrom-Json).sdk.version)
          [xml]$props = Get-Content -LiteralPath 'Directory.Build.props' -Raw
          $version = [string]$props.Project.PropertyGroup.VersionPrefix
          $targetFramework = [string]$props.Project.PropertyGroup.TargetFramework
          $minimumTests = [int]$props.Project.PropertyGroup.SteamSentinelMinimumSelfTests
          if ($sdk -notmatch '^\d+\.\d+\.\d+$' -or $version -notmatch '^\d+\.\d+\.\d+$' -or
              [string]::IsNullOrWhiteSpace($targetFramework) -or $minimumTests -lt 1) {
            throw 'The central build contract is invalid.'
          }

          [xml]$appManifest = Get-Content -LiteralPath 'SteamSentinel.App/app.manifest' -Raw
          [xml]$brokerManifest = Get-Content -LiteralPath 'SteamSentinel.Broker/app.manifest' -Raw
          $expectedManifestVersion = "$version.0"
          if ($appManifest.assembly.assemblyIdentity.version -ne $expectedManifestVersion -or
              $brokerManifest.assembly.assemblyIdentity.version -ne $expectedManifestVersion) {
            throw 'Application manifest version drifted from Directory.Build.props.'
          }
          $installer = Get-Content -LiteralPath 'installer/SteamSentinel.iss' -Raw
          if ($installer -notmatch ('(?m)^#define AppVersion "' + [regex]::Escape($version) + '"\r?$')) {
            throw 'Installer default version drifted from Directory.Build.props.'
          }

          "sdk=$sdk" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "target_framework=$targetFramework" >> $env:GITHUB_OUTPUT
          "minimum_tests=$minimumTests" >> $env:GITHUB_OUTPUT

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ steps.contract.outputs.sdk }}
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Verify SDK pin
        shell: pwsh
        run: |
          $actual = (dotnet --version).Trim()
          $expected = '${{ steps.contract.outputs.sdk }}'
          if ($actual -ne $expected) {
            throw "Expected .NET SDK $expected, got $actual."
          }

      - name: Build and probe unified native startup
        id: startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = Join-Path $env:RUNNER_TEMP 'SteamSentinel-unified-payload'
          $nativeBuild = Join-Path $env:RUNNER_TEMP 'SteamSentinel-unified-native-build'
          $results = Join-Path $env:RUNNER_TEMP 'SteamSentinel-unified-startup-results.json'
          "result_path=$results" >> $env:GITHUB_OUTPUT
          $firewallResults = Join-Path $env:RUNNER_TEMP 'SteamSentinel-worker-firewall-contract-results.json'
          $winPs = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $winPs -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File './scripts/Test-WorkerFirewallContract.ps1' -ResultsPath $firewallResults
          if ($LASTEXITCODE -ne 0) {
            throw "Worker firewall contract tests failed ($LASTEXITCODE)."
          }
          if (-not (Test-Path -LiteralPath $firewallResults -PathType Leaf)) {
            throw 'Worker firewall contract tests did not write results.'
          }
          $firewallResult = Get-Content -LiteralPath $firewallResults -Raw | ConvertFrom-Json
          if ([int]$firewallResult.passed -lt 20 -or [int]$firewallResult.failed -ne 0 -or
              [int]$firewallResult.skipped -ne 0 -or $firewallResult.systemFirewallAccessed -ne $false) {
            throw 'Worker firewall contract tests did not satisfy the inert zero-failure gate.'
          }

          $buildId = "$env:GITHUB_SHA.ci"
          $version = '${{ steps.contract.outputs.version }}'
          $properties = @('-p:SelfContained=true', '-p:UseAppHost=true', '-p:CetCompat=true',
            '-p:AppendRuntimeIdentifierToOutputPath=false', '-p:ContinuousIntegrationBuild=true',
            "-p:SteamSentinelSourceRevision=$env:GITHUB_SHA", '-p:SteamSentinelBuildChannel=ci',
            "-p:SteamSentinelBuildId=$buildId")
          dotnet restore SteamSentinel.slnx --locked-mode -r win-x64 `
            --source https://api.nuget.org/v3/index.json @properties
          if ($LASTEXITCODE -ne 0) { throw "Self-contained restore failed ($LASTEXITCODE)." }
          git diff --exit-code -- '**/packages.lock.json'
          if ($LASTEXITCODE -ne 0) { throw 'Self-contained restore changed a lock file.' }
          foreach ($project in @('SteamSentinel.App', 'SteamSentinel.Broker', 'SteamSentinel.ArchiveWorker')) {
            dotnet publish "$project/$project.csproj" -c Release -r win-x64 --self-contained true `
              --no-restore -o $payload '-p:PublishSingleFile=false' '-p:PublishTrimmed=false' @properties
            if ($LASTEXITCODE -ne 0) { throw "Self-contained publish failed: $project ($LASTEXITCODE)." }
          }
          $manifest = & ./scripts/build-unified-startup.ps1 -PublishRoot $payload -BuildRoot $nativeBuild `
            -Version $version -BuildIdentity "$version+$buildId"
          if ($manifest.mode -ne 'unified' -or @($manifest.hosts).Count -ne 9) {
            throw 'Unified native build did not verify all launchers and hosts.'
          }
          $hashes = @(Get-ChildItem -LiteralPath $payload -Recurse -File |
            Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object FullName | ForEach-Object {
              '{0} *{1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash,
                $_.FullName.Substring($payload.Length + 1)
            })
          [IO.File]::WriteAllLines((Join-Path $payload 'SHA256SUMS.txt'), [string[]]$hashes,
            [Text.UTF8Encoding]::new($false))
          & ./scripts/Test-UnifiedStartup.ps1 -PublishRoot $payload -ResultsPath $results
          if (-not (Test-Path -LiteralPath $results -PathType Leaf)) { throw 'Startup tests did not write results.' }
          $result = Get-Content -LiteralPath $results -Raw | ConvertFrom-Json
          if ([int]$result.passed -lt 1 -or [int]$result.failed -ne 0 -or [int]$result.skipped -ne 0) {
            throw 'Unified startup acceptance requires passing checks with zero failures and zero skips.'
          }

      - name: Upload unified startup result
        if: always() && steps.startup.outputs.result_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SteamSentinel-unified-startup-${{ github.sha }}
          path: ${{ steps.startup.outputs.result_path }}
          if-no-files-found: error
          retention-days: 30
